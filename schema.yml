          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 280
          pattern: ^[-a-zA-Z0-9_]+$
        author:
          type: string
          maxLength: 255
        description:
          type: string
        cover_image:
          type: string
          format: uri
          nullable: true
        sku:
          type: string
          maxLength: 64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        discount_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        stock_quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        active:
          type: boolean
      required:
      - id
      - price
      - sku
      - slug
      - title
    OrderCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 20
        secondary_phone:
          type: string
          maxLength: 20
        address:
          type: string
        city:
          type: string
          maxLength: 120
        book_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
        customer_note:
          type: string
        delivery_charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        source:
          type: string
          maxLength: 120
        landing_page:
          type: string
          maxLength: 255
        landing_page_slug:
          type: string
          maxLength: 255
        campaign:
          type: string
          maxLength: 255
        utm_source:
          type: string
          maxLength: 120
        utm_medium:
          type: string
          maxLength: 120
        utm_campaign:
          type: string
          maxLength: 120
        utm_term:
          type: string
          maxLength: 120
        utm_content:
          type: string
          maxLength: 120
        idempotency_key:
          type: string
          maxLength: 128
      required:
      - address
      - book_id
      - name
      - phone
      - quantity
    OrderPublic:
      type: object
      properties:
        order_number:
          type: string
          maxLength: 32
        customer_name:
          type: string
        customer_phone:
          type: string
        book_title:
          type: string
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
      required:
      - book_title
      - created_at
      - customer_name
      - customer_phone
      - order_number
      - quantity
      - total_amount
    StatusEnum:
      enum:
      - NEW
      - CONFIRMED
      - PROCESSING
      - READY_TO_SHIP
      - SHIPPED
      - DELIVERED
      - CANCELLED
      - DELIVERY_FAILED
      - RETURNED
      type: string
      description: |-
        * `NEW` - New
        * `CONFIRMED` - Confirmed
        * `PROCESSING` - Processing
        * `READY_TO_SHIP` - Ready to Ship
        * `SHIPPED` - Shipped
        * `DELIVERED` - Delivered
        * `CANCELLED` - Cancelled
        * `DELIVERY_FAILED` - Delivery Failed
        * `RETURNED` - Returned
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
